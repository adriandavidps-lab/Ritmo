    <script>
      // Corre antes que nada: si el tema se resolviera ya dentro de React, al
      // abrir en modo noche se veria un fogonazo blanco. Se lee de una clave
      // suelta en vez del estado completo para no parsear todo el JSON aqui.
      (function () {
        try {
          var elegido = localStorage.getItem('ritmo:tema') || 'auto';
          var oscuro =
            elegido === 'oscuro' ||
            (elegido === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var raiz = document.documentElement;
          raiz.dataset.tema = oscuro ? 'oscuro' : 'claro';
          raiz.style.backgroundColor = oscuro ? '#0a1020' : '#e9eef8';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', oscuro ? '#0a1020' : '#e9eef8');
        } catch (e) {
          /* sin localStorage se queda en claro, que es el valor del CSS */
        }
      })();
    </script>

<style>
/* ===== Ritmo · tema "Cristal azul" =====
   Capa encima del estilo original: solo cambia colores, superficies y formas. */
:root{
  --fondo:#e9eef8;--fondo-2:#dde5f4;--fuera:#e9eef8;

  --vidrio-luz:inset 0 1px 0 rgba(255,255,255,.9);
  --sombra:0 2px 6px rgba(36,70,150,.06),0 18px 40px rgba(36,70,150,.12);
  --sombra-baja:0 1px 2px rgba(36,70,150,.05),0 10px 28px rgba(36,70,150,.09);
  --sombra-hoja:0 -10px 50px rgba(20,40,100,.2);
  --sombra-pulgar:0 2px 8px rgba(20,40,100,.25);
  --brillo-azul:0 8px 22px rgba(47,107,255,.38),0 2px 6px rgba(47,107,255,.25);
  --mancha-1:rgba(110,155,255,.45);--mancha-2:rgba(160,190,255,.55);--mancha-3:rgba(140,120,255,.22);
  --r-sm:12px;--r-md:16px;--r-lg:24px;--r-xl:30px;
}
:root[data-tema=oscuro]{
  --fondo:#0a1020;--fondo-2:rgba(255,255,255,.06);--fuera:#0a1020;
  --tarjeta:rgba(24,34,60,.55);--tarjeta-alta:rgba(34,46,78,.7);
  --borde:rgba(255,255,255,.1);--borde-suave:rgba(255,255,255,.07);
  --texto:#eef2ff;--texto-2:#a5b0cc;--texto-3:#6f7b99;
  --acento:#4d8dff;--acento-2:#78a8ff;--acento-suave:rgba(77,141,255,.16);
  --azul-1:#5b97ff;--azul-2:#2f62f0;
  --menta:#34d1ab;--menta-suave:rgba(52,209,171,.15);
  --rosa:#ff7088;--rosa-suave:rgba(255,112,136,.14);--rosa-borde:rgba(255,112,136,.4);

  --cielo:#4d8dff;--cielo-suave:rgba(77,141,255,.16);
  --necesidad:#4d8dff;--gusto:#a28bff;--ahorro:#34d1ab;

  --nav-fondo:rgba(20,30,54,.62);
  --brindis-fondo:rgba(26,38,66,.86);--brindis-logro-fondo:rgba(60,46,20,.86);

  --vidrio-borde:rgba(255,255,255,.09);
  --vidrio-luz:inset 0 1px 0 rgba(255,255,255,.07);
  --sombra:0 2px 6px rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.45);

/* Fondo: degradado suave con manchas de luz azul */
html,body{background:var(--fondo);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42vmax 42vmax at -8% -6%,var(--mancha-1),transparent 62%),
    radial-gradient(38vmax 38vmax at 108% 28%,var(--mancha-2),transparent 60%),
    radial-gradient(40vmax 40vmax at 20% 110%,var(--mancha-3),transparent 60%),
    var(--fondo);
}
.app{background:transparent}
@media (min-width:720px){body{background:var(--fondo)}.app{border:none}}

/* Títulos */
.encabezado h1{font-weight:800;letter-spacing:-.035em}
.saludo,.seccion-titulo{color:var(--acento);letter-spacing:.12em}
.tarjeta h2{font-weight:700}

/* Superficies de vidrio */
.tarjeta,.brindis,.hoja,.nav-inner{
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
}
.tarjeta{
  background:var(--tarjeta);border:1px solid var(--vidrio-borde);
  border-radius:var(--r-lg);box-shadow:var(--sombra-baja),var(--vidrio-luz);padding:18px;
}
.tarjeta--plana{box-shadow:var(--vidrio-luz)}

/* Navegación: píldora flotante */
.nav{background:transparent;border-top:none;-webkit-backdrop-filter:none;backdrop-filter:none;
  padding:0 14px calc(env(safe-area-inset-bottom) + 10px)}
.nav-inner{background:var(--nav-fondo);border:1px solid var(--vidrio-borde);border-radius:26px;
  box-shadow:var(--sombra),var(--vidrio-luz);max-width:512px}
.pantalla{padding-bottom:calc(var(--nav-alto) + env(safe-area-inset-bottom) + 40px)}
.nav-boton{position:relative;font-weight:600}
.nav-boton[aria-current=page]{color:var(--acento)}
.nav-boton[aria-current=page] svg{filter:drop-shadow(0 4px 8px rgba(47,107,255,.45))}
.nav-boton[aria-current=page]::after{content:"";position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;
  background:var(--acento);box-shadow:0 0 8px var(--acento)}

/* Botones */
.boton{background:var(--tarjeta-alta);border:1px solid var(--vidrio-borde);
  box-shadow:var(--sombra-baja),var(--vidrio-luz);border-radius:var(--r-md);font-weight:700}
.boton--primario{background:linear-gradient(135deg,var(--azul-1),var(--azul-2));border-color:transparent;
  color:#fff;box-shadow:var(--brillo-azul),inset 0 1px 0 rgba(255,255,255,.3)}
.boton--menta{background:var(--acento-suave);color:var(--acento-2);border-color:transparent;box-shadow:none}
.boton--fantasma{background:transparent;border-color:var(--borde);box-shadow:none;color:var(--texto-2)}
.boton--peligro{background:transparent;box-shadow:none}

/* Campos */
.entrada,.yape-sel{background:var(--tarjeta-alta);border:1px solid var(--vidrio-borde);
  box-shadow:inset 0 1px 3px rgba(20,40,100,.08)}
.entrada:focus{background:var(--tarjeta-alta);border-color:var(--acento);box-shadow:0 0 0 4px var(--acento-suave)}
.entrada--monto,.entrada--monto:focus{background:transparent;border-color:transparent;box-shadow:none}

/* Chips */
.chip{background:var(--tarjeta-alta);border:1px solid var(--vidrio-borde);box-shadow:var(--vidrio-luz)}
.chip[aria-pressed=true]{background:linear-gradient(135deg,var(--azul-1),var(--azul-2));color:#fff;
  border-color:transparent;box-shadow:0 6px 16px rgba(47,107,255,.32)}

/* Barras de progreso */
.barra{background:var(--acento-suave);height:9px}
.barra>i{background:linear-gradient(90deg,var(--azul-1),var(--azul-2));box-shadow:0 0 10px rgba(47,107,255,.45)}
.barra--menta>i{background:linear-gradient(90deg,#3fe0b9,var(--menta));box-shadow:0 0 10px rgba(20,168,138,.4)}
.barra--rosa>i{background:linear-gradient(90deg,#ff8a9c,var(--rosa));box-shadow:0 0 10px rgba(224,84,106,.4)}
.barra--ambar>i{background:linear-gradient(90deg,#ffc56b,var(--ambar));box-shadow:0 0 10px rgba(212,138,30,.4)}

/* Cifras */
.cifra{font-weight:800;letter-spacing:-.045em}
.positivo{color:var(--acento)}

/* Listas */
.item-emoji{background:var(--tarjeta-alta);border:1px solid var(--vidrio-borde);border-radius:14px;
  box-shadow:0 4px 12px rgba(36,70,150,.1),var(--vidrio-luz)}
.item:not(:last-child):after{background:var(--borde)}
.insignia{background:var(--acento-suave);color:var(--acento-2)}

/* Interruptor y deslizador */
.interruptor{background:var(--fondo-2);border-color:var(--borde)}
.interruptor[aria-checked=true]{background:linear-gradient(135deg,var(--azul-1),var(--azul-2));box-shadow:0 4px 12px rgba(47,107,255,.35)}
input[type=range]::-webkit-slider-runnable-track{background:var(--acento-suave)}
input[type=range]::-moz-range-track{background:var(--acento-suave)}

/* Hoja inferior y avisos */
.hoja{background:var(--tarjeta-alta);border-top:1px solid var(--vidrio-borde)}
:root[data-tema=oscuro] .hoja{background:rgba(18,26,48,.92)}
.hoja-fondo{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brindis{border:1px solid var(--vidrio-borde);border-radius:var(--r-md)}

/* Mapa de calor */
.calor-celda{background:var(--acento-suave)}

/* Teléfonos que no soportan desenfoque: superficies opacas para que se lea bien */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--tarjeta:#f7f9ff;--nav-fondo:#f7f9ff}
  :root[data-tema=oscuro]{--tarjeta:#16203a;--nav-fondo:#16203a}
}

[hidden]{display:none!important}
/* Resumen del mes */
.rs-cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rs-cifras .seccion-titulo{display:block;margin-bottom:4px;font-size:.66rem}
.rs-cifras .cifra--sm{font-size:1.12rem;font-weight:800}
.rs-leyenda{display:flex;gap:14px;font-size:.78rem;color:var(--texto-2);margin-bottom:6px}
.rs-leyenda span{display:inline-flex;align-items:center;gap:6px}
.rs-punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.rs-punto--este{background:var(--acento);box-shadow:0 0 6px var(--acento)}
.rs-punto--ant{background:var(--texto-3)}
.rs-grafico{position:relative;touch-action:pan-y}
.rs-grafico svg{display:block;width:100%;height:150px;overflow:visible}
.rs-grid{stroke:var(--borde);stroke-width:1;vector-effect:non-scaling-stroke}
.rs-grid--suave{stroke-dasharray:3 4;opacity:.7}
.rs-linea{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.rs-linea--este{stroke:var(--acento)}
.rs-linea--ant{stroke:var(--texto-3);stroke-dasharray:5 4}
.rs-area{fill:var(--acento-suave);stroke:none}
.rs-fin{fill:var(--acento);stroke:var(--tarjeta-alta);stroke-width:2;vector-effect:non-scaling-stroke}
.rs-cursor{stroke:var(--texto-3);stroke-width:1;vector-effect:non-scaling-stroke}
.rs-eje{fill:var(--texto-3);font-size:10px}
.rs-tope{position:absolute;top:-6px;left:2px;font-size:.68rem}
.rs-tip{position:absolute;top:4px;min-width:110px;padding:8px 10px;border-radius:12px;font-size:.78rem;pointer-events:none;
  background:var(--tarjeta-alta);border:1px solid var(--vidrio-borde);box-shadow:var(--sombra);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.rs-tip[hidden]{display:none}
.rs-quien{display:grid;gap:10px;margin-top:10px}
.rs-nombre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brindis--peligro{border-color:var(--rosa-borde)!important}
#extras-brindis{top:calc(env(safe-area-inset-top) + 74px)}
/* Extras 2 */
.x-mini{padding:7px 12px;font-size:.82rem;border-radius:12px}
.x-sin-boton{background:none;border:none;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0}
.item-cuerpo.x-sin-boton{display:block}
.x-enlace{background:none;border:none;padding:4px 0;color:var(--acento);font-weight:600;font-size:.84rem;cursor:pointer}
.x-fila-emoji{display:grid;grid-template-columns:72px 1fr;gap:10px}
.x-check-grande{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--borde);background:var(--tarjeta-alta);
  color:#fff;font-weight:800;display:grid;place-items:center;transition:transform .12s,background .16s}
.x-check-grande:active{transform:scale(.9)}
.x-check-grande--ok{background:linear-gradient(135deg,var(--azul-1),var(--azul-2));border-color:transparent;box-shadow:0 4px 12px rgba(47,107,255,.35)}
.x-hecho .item-titulo{text-decoration:line-through;color:var(--texto-3)}
.x-nuevo-pendiente{display:grid;grid-template-columns:1fr 56px;gap:8px}
.x-nuevo-pendiente [data-p="texto"]{grid-column:1/-1}
.x-nuevo-pendiente .boton{padding:0;font-size:1.3rem}
.x-meta-nombre{font-weight:700}
.x-frecuentes .chip{font-size:.84rem}
.x-check{width:20px;height:20px;accent-color:var(--acento)}
.x-brindis-boton{pointer-events:auto;padding:7px 12px;font-size:.82rem;flex:none}
.x-fab{position:fixed;z-index:45;right:max(18px,calc(50vw - 252px));bottom:calc(var(--nav-alto) + env(safe-area-inset-bottom) + 24px);
  width:56px;height:56px;border-radius:50%;border:none;color:#fff;font-size:1.9rem;font-weight:500;line-height:1;
  background:linear-gradient(135deg,var(--azul-1),var(--azul-2));box-shadow:var(--brillo-azul),inset 0 1px 0 rgba(255,255,255,.35);
  display:grid;place-items:center;transition:transform .12s}
.x-fab:active{transform:scale(.92)}

</style>

(function () {

<script>

    var mejor = (x.habitos || []).map(function (h) { return { nombre: h.nombre, r: racha(h) }; }).sort(function (a, b) { return b.r - a.r; })[0];
    return {
      pagosFijos: (x.pagosFijos || []).map(function (p) { return { id: p.id, nombre: p.nombre, emoji: p.emoji, monto: p.monto, dia: p.dia, pagado: !!pg[m + '|' + p.id] }; }),
      habitos: (x.habitos || []).map(function (h) { return { id: h.id, nombre: h.nombre, emoji: h.emoji, dias: h.dias, hora: h.hora || '', hechoHoy: !!(x.habitosHechos || {})[f + '|' + h.id] }; }),
      pendientes: (x.pendientes || []).filter(function (p) { return !p.hecho && p.fecha; }).map(function (p) { return { id: p.id, texto: p.texto, fecha: p.fecha }; }),
      semana: { desde: desde, total: Math.round(sem * 100) / 100, anterior: Math.round(ant * 100) / 100, topCat: topCat || '',
        habitos: habDeSemana ? { hechos: habHechos, total: habDeSemana } : null, mejorRacha: mejor && mejor.r > 1 ? mejor : null },
    };
  };

  // =====================================================================
  // Enganche
  // =====================================================================
  var SLOTS = { 'pagos-slot': pintarPagos, 'metas-slot': pintarMetas, 'habitos-slot': pintarHabitos, 'pendientes-slot': pintarPendientes };
  var vistos = {};
  function pintarTodo(forzar) {
    Object.keys(SLOTS).forEach(function (id) {
      var s = document.getElementById(id);
      if (!s) { vistos[id] = null; return; }
      if (forzar || vistos[id] !== s) {
        if (s.contains(document.activeElement) && s.querySelector('[data-p="texto"]') === document.activeElement && document.activeElement.value) return;
        vistos[id] = s; SLOTS[id](s);
      }
    });
    actualizarFab();
  }
  new MutationObserver(function () { pintarTodo(false); }).observe(document.documentElement, { childList: true, subtree: true });
    window.addEventListener('ritmo:estado', function () {
    var r = R(); if (!r || !r.estado.onboarded) { actualizarFab(); return; }
    detectarPagos(r.estado);
    pintarTodo(true);
  });
  // A medianoche cambia "hoy": repinta al volver a la app.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pintarTodo(true); });
})();

</script>
<script>
(function () {
  // Lee los comprobantes de YAPE (BCP Bolivia) en Gmail y los anota como gastos.
  // Dos caminos, segun donde este abierta la pagina:
  //  - dentro de Claude: el conector de Gmail del que mira la pagina;
  //  - suelta (GitHub Pages, instalada en el celular): un Google Apps Script
  //    propio cuya direccion y clave viven solo en este navegador.
  // Solo cuenta "Transferencia QR" y "Pago de Servicio": las "Factura adjunta"
  // repiten pagos de servicio que ya llegaron con su comprobante.
  var CLAVE = 'ritmo:yape:v1';
  var SERVIDOR = 'Gmail';
  var enClaude = !!(window.claude && window.claude.use);
  var ocupado = false;
  var mensaje = '';
  var editando = false;

  function leer() {
    try { return JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch (e) { return {}; }
  }
  function guardar(cfg) {
    try { localStorage.setItem(CLAVE, JSON.stringify(cfg)); } catch (e) {}
  }
  function cfg() {
    var c = leer();
    c.hechos = c.hechos || {};
    c.catQR = c.catQR || 'cat-otros';
    c.catServicio = c.catServicio || 'cat-servicios';
    return c;
  }
  function ritmo() { return window.__ritmo || null; }
  function conectadoScript(c) { return !!(c.url && c.clave); }

  function dosDig(n) { return String(n).padStart(2, '0'); }
  function hoyISO() { var d = new Date(); return d.getFullYear() + '-' + dosDig(d.getMonth() + 1) + '-' + dosDig(d.getDate()); }
  function inicioDeMes() { var d = new Date(); return d.getFullYear() + '/' + dosDig(d.getMonth() + 1) + '/01'; }

  function texto(m) {
    if (m.plaintextBody) return m.plaintextBody.replace(/\s+/g, ' ');
    if (m.htmlBody) {
      try {
        var doc = new DOMParser().parseFromString(m.htmlBody.replace(/</g, ' <'), 'text/html');
        return (doc.body ? doc.body.textContent : '').replace(/\s+/g, ' ');
      } catch (e) { return ''; }
    }
    return (m.snippet || '').replace(/\s+/g, ' ');
  }
  function numero(s) {
    s = String(s).trim();
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/,/g, '');
    else s = s.replace(',', '.');
    return Number(s);
  }
  function titulo(s) {
    return s.toLowerCase().replace(/(^|\s)\S/g, function (l) { return l.toUpperCase(); });
  }

  function interpretar(m) {
    var t = texto(m);
    var asunto = m.subject || '';
    var esQR = /Transferencia QR/i.test(asunto);
    var esServ = /Pago de Servicio/i.test(asunto);
    if (!esQR && !esServ) return null;
    var tx = /Transacci[oó]n:\s*(\d+)/i.exec(t) || /Transacci[oó]n:\s*(\d+)/i.exec(m.snippet || '');
    var monto = /Monto (?:transferido|pagado):\s*(?:BOL|Bs\.?)?\s*([\d.,]+)/i.exec(t);
    if (!tx || !monto) return null;
    var f = /Fecha:\s*(\d{2})\/(\d{2})\/(\d{2,4})/.exec(t);
    var fecha;
    if (f) {
      var anio = f[3].length === 2 ? '20' + f[3] : f[3];
      fecha = anio + '-' + f[2] + '-' + f[1];
    } else if (m.date) {
      var d = new Date(m.date);
      fecha = d.getFullYear() + '-' + dosDig(d.getMonth() + 1) + '-' + dosDig(d.getDate());
    } else fecha = hoyISO();
    var quien = '';
    if (esQR) {
      var b = /Beneficiario:\s*(.+?)\s+Cuenta:/i.exec(t);
      quien = b ? titulo(b[1]) : 'Transferencia QR';
    } else {
      var e = /Empresa:\s*(.+?)\s+(?:Cod\. Cliente|Detalle)/i.exec(t);
      quien = e ? e[1].replace(/\s+-\s+/g, ' · ') : 'Pago de servicio';
    }
    return {
      tx: tx[1],
      monto: numero(monto[1]),
      fecha: fecha,
      nota: 'Yape · ' + quien.trim(),
      tipo: esQR ? 'qr' : 'servicio',
      creadoEn: m.date ? Date.parse(m.date) : Date.now(),
    };
  }

  function existentes() {
    var r = ritmo(), mapa = {};
    (r ? r.estado.gastos : []).forEach(function (g) { mapa[g.id] = true; });
    return mapa;
  }

  // Anota un pago si es nuevo. Devuelve true si entro.
  function anotar(g, c, ya) {
    if (!g || !g.tx || !(Number(g.monto) > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(g.fecha || '')) return false;
    if (c.hechos[g.tx] || ya['yape-' + g.tx]) return false;
    ritmo().dispatch({
      tipo: 'gasto/crear',
      gasto: {
        id: 'yape-' + g.tx,
        monto: Number(g.monto),
        categoriaId: g.tipo === 'qr' ? c.catQR : c.catServicio,
        nota: String(g.nota || 'Yape').slice(0, 80),
        fecha: g.fecha,
        creadoEn: Number(g.creadoEn) || Date.now(),
      },
    });
    c.hechos[g.tx] = g.fecha;
    ya['yape-' + g.tx] = true;
    return true;
  }

  function explicarMcp(err) {
    var c = err && err.code;
    if (c === 'server_not_connected' || c === 'server_not_found') return 'No encuentro tu Gmail. Conéctalo en claude.ai → Ajustes → Conectores.';
    if (c === 'needs_reauth') return 'Gmail pide que vuelvas a conectarlo en claude.ai → Ajustes → Conectores.';
    if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'Falta tu permiso para leer Gmail. Toca "Revisar correos" y acepta.';
    if (c === 'selection_required') return 'Tienes más de un Gmail conectado: elige uno en el aviso de Claude.';
    if (c === 'blocked_by_policy') return 'Tu organización no permite usar Gmail aquí.';
    if (c === 'server_unavailable' || c === 'rate_limited') return 'Gmail no respondió. Intenta en un rato.';
    if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Esta vista no puede leer Gmail.';
    return 'No pude leer Gmail' + (err && err.message ? ': ' + err.message : '.');
  }

  async function porClaude(c, desde) {
    var mcp = null;
    try { mcp = await window.claude.use('mcp'); } catch (e) { mcp = null; }
    if (!mcp) throw { propio: 'Esta vista no puede leer Gmail.' };
    var q = 'from:bcp.com.bo (subject:"Transferencia QR" OR subject:"Pago de Servicio") after:' + desde;
    var token = '', paginas = 0, mensajes = [];
    try {
      do {
        var arg = { query: q, pageSize: 50 };
        if (token) arg.pageToken = token;
        var res = await mcp.callTool(SERVIDOR, 'search_threads', arg, { cache: false });
        var p = res.payload || {};
        var hilos = p.threads || [];
        for (var i = 0; i < hilos.length; i++) {
          var h = hilos[i];
          var lista = h.messages || [];
          if ((h.messageCount || 0) > lista.length) {
            try {
              var th = await mcp.callTool(SERVIDOR, 'get_thread', { threadId: h.id, messageFormat: 'PLAIN_TEXT' }, { cache: false });
              lista = ((th.payload || {}).messages || []).map(function (m) { m._completo = true; return m; });
            } catch (e) { /* nos quedamos con los que ya vinieron */ }
          }
          mensajes = mensajes.concat(lista);
        }
        token = p.nextPageToken || '';
        paginas++;
      } while (token && paginas < 4);

      var ya = existentes(), nuevos = 0;
      for (var j = 0; j < mensajes.length; j++) {
        var m = mensajes[j];
        if (!/Transferencia QR|Pago de Servicio/i.test(m.subject || '')) continue;
        var txs = /Transacci[oó]n:\s*(\d+)/i.exec(m.snippet || '');
        if (txs && (c.hechos[txs[1]] || ya['yape-' + txs[1]])) continue;
        var completo = m;
        if (!m._completo || (!m.plaintextBody && !m.htmlBody)) {
          var gm = await mcp.callTool(SERVIDOR, 'get_message', { messageId: m.id, messageFormat: 'PLAIN_TEXT' }, { cache: false });
          completo = gm.payload || m;
          if (!completo.subject) completo.subject = m.subject;
          if (!completo.date) completo.date = m.date;
        }
        if (anotar(interpretar(completo), c, ya)) nuevos++;
      }
      return nuevos;
    } catch (err) {
      if (err && err.propio) throw err;
      throw { propio: explicarMcp(err) };
    }
  }

  async function porScript(c, desde) {
    var url = c.url + (c.url.indexOf('?') >= 0 ? '&' : '?') +
      'k=' + encodeURIComponent(c.clave) + '&desde=' + encodeURIComponent(desde);
    var datos;
    try {
      var res = await fetch(url, { redirect: 'follow' });
      datos = await res.json();
    } catch (e) {
      throw { propio: navigator.onLine === false
        ? 'Sin internet. Lo intento de nuevo cuando vuelvas a abrir Dinero.'
        : 'No pude hablar con tu script de Google. Revisa la dirección (debe terminar en /exec) y que esté implementado para "Cualquier usuario".' };
    }
    if (datos && datos.error === 'clave') throw { propio: 'La clave no coincide con la de tu script. Revísala en "Conexión".' };
    if (!datos || !Array.isArray(datos.pagos)) throw { propio: 'Tu script respondió algo raro. Vuelve a implementarlo con el código de Ritmo.' };
    var ya = existentes(), nuevos = 0;
    datos.pagos
      .slice()
      .sort(function (a, b) { return (a.creadoEn || 0) - (b.creadoEn || 0); })
      .forEach(function (g) { if (anotar(g, c, ya)) nuevos++; });
    return nuevos;
  }

  async function sincronizar(silencioso) {
    if (ocupado || !ritmo()) return;
    var c = cfg();
    if (!enClaude && !conectadoScript(c)) {
      mensaje = 'Primero conecta tu script de Google en "Conexión".';
      editando = true;
      pintar();
      return;
    }
    ocupado = true;
    if (!silencioso) mensaje = 'Revisando tus correos de YAPE…';
    pintar();
    var desde = c.desde || inicioDeMes();
    try {
      var nuevos = enClaude ? await porClaude(c, desde) : await porScript(c, desde);
      c.desde = c.desde || desde;
      c.ultima = Date.now();
      c.auto = true;
      mensaje = nuevos
        ? 'Anoté ' + nuevos + (nuevos === 1 ? ' pago nuevo' : ' pagos nuevos') + ' de YAPE.'
        : 'Todo al día: no hay pagos nuevos.';
    } catch (err) {
      mensaje = (err && err.propio) || 'No pude revisar tus correos.';
    }
    guardar(c); // lo que alcanzo a entrar queda marcado y no se repite
    ocupado = false;
    pintar();
  }

  function hace(ms) {
    var min = Math.round((Date.now() - ms) / 60000);
    if (min < 1) return 'recién';
    if (min < 60) return 'hace ' + min + ' min';
    var h = Math.round(min / 60);
    if (h < 24) return 'hace ' + h + ' h';
    return 'hace ' + Math.round(h / 24) + ' días';
  }

  function opciones(sel, actual) {
    var r = ritmo();
    var cats = r ? r.estado.categorias : [];
    sel.innerHTML = '';
    cats.forEach(function (k) {
      var o = document.createElement('option');
      o.value = k.id;
      o.textContent = (k.emoji ? k.emoji + ' ' : '') + k.nombre;
      if (k.id === actual) o.selected = true;
      sel.appendChild(o);
    });
  }

  function construir(slot) {
    slot.innerHTML =
      '<div class="tarjeta-titulo"><h2>💜 YAPE automático</h2></div>' +
      '<p class="tenue yape-estado" style="margin:0 0 10px"></p>' +
      '<div class="yape-cats">' +
      '<label class="tenue-2">Transferencias QR van a <select class="yape-sel" data-k="catQR"></select></label>' +
      '<label class="tenue-2">Pagos de servicio van a <select class="yape-sel" data-k="catServicio"></select></label>' +
      '</div>' +
      '<div class="yape-conexion" hidden>' +
      '<label class="tenue-2">Dirección de tu script (termina en /exec)<input class="yape-in entrada" data-k="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>' +
      '<label class="tenue-2">Clave<input class="yape-in entrada" data-k="clave" type="password" autocomplete="off" spellcheck="false"></label>' +
      '<button class="boton boton--menta boton--bloque yape-guardar" type="button">Guardar conexión</button>' +
      '</div>' +
      '<button class="boton boton--primario boton--bloque yape-boton" type="button" style="margin-top:10px">Revisar correos</button>' +
      '<button class="boton boton--fantasma boton--bloque yape-editar" type="button" style="margin-top:6px" hidden>Conexión</button>';
    slot.querySelector('.yape-boton').addEventListener('click', function () { sincronizar(false); });
    slot.querySelector('.yape-editar').addEventListener('click', function () { editando = !editando; pintar(); });
    slot.querySelector('.yape-guardar').addEventListener('click', function () {
      var c = cfg();
      var url = slot.querySelector('[data-k="url"]').value.trim();
      var clave = slot.querySelector('[data-k="clave"]').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
        mensaje = 'Esa dirección no parece de Google Apps Script. Cópiala desde "Implementar".';
        pintar();
        return;
      }
      if (!clave) { mensaje = 'Falta la clave.'; pintar(); return; }
      c.url = url; c.clave = clave; guardar(c);
      editando = false;
      mensaje = 'Conexión guardada solo en este teléfono.';
      sincronizar(false);
    });
    slot.querySelectorAll('.yape-sel').forEach(function (s) {
      s.addEventListener('change', function () {
        var c = cfg(); c[s.dataset.k] = s.value; guardar(c);
      });
    });
    slot.dataset.listo = '1';
  }

  function pintar() {
    var slot = document.getElementById('yape-slot');
    if (!slot) return;
    if (!slot.dataset.listo) construir(slot);
    var c = cfg();
    var sinConexion = !enClaude && !conectadoScript(c);
    var linea = mensaje;
    if (!linea) {
      if (sinConexion) linea = 'Conecta tu script de Google (ver LEEME) y anoto aquí los pagos de YAPE que te llegan a Gmail.';
      else if (c.ultima) linea = 'Última revisión ' + hace(c.ultima) + '. Anoto cada pago una sola vez.';
      else linea = 'Leo los comprobantes de YAPE que te llegan a Gmail y los anoto aquí, sin repetirlos. La primera vez traigo los de este mes.';
    }
    slot.querySelector('.yape-estado').textContent = linea;
    var boton = slot.querySelector('.yape-boton');
    boton.disabled = ocupado;
    boton.textContent = ocupado ? 'Revisando…' : 'Revisar correos';
    var conexion = slot.querySelector('.yape-conexion');
    var verConexion = !enClaude && (editando || sinConexion);
    conexion.hidden = !verConexion;
    if (verConexion && !conexion.contains(document.activeElement)) {
      slot.querySelector('[data-k="url"]').value = c.url || '';
      slot.querySelector('[data-k="clave"]').value = c.clave || '';
    }
    boton.hidden = sinConexion;
    var editar = slot.querySelector('.yape-editar');
    editar.hidden = enClaude || sinConexion;
    editar.textContent = editando ? 'Cerrar conexión' : 'Conexión';
    slot.querySelectorAll('.yape-sel').forEach(function (s) {
      if (document.activeElement !== s) opciones(s, c[s.dataset.k]);
    });
  }

  var vistoSlot = null;
  function revisarSlot() {
    var slot = document.getElementById('yape-slot');
    if (slot && slot !== vistoSlot) {
      vistoSlot = slot;
      pintar();
      var c = cfg();
      var puede = enClaude || conectadoScript(c);
      if (puede && c.auto && (!c.ultima || Date.now() - c.ultima > 10 * 60000)) sincronizar(true);
    }
  }
  new MutationObserver(revisarSlot).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('ritmo:estado', function () { if (!ocupado) revisarSlot(); });
  document.addEventListener('DOMContentLoaded', revisarSlot);
})();

</script>
